name: Update Wiki

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      changelog_count:
        description: "Number of recent commits to include in the changelog"
        required: false
        default: "20"

env:
  CHANGELOG_COUNT: ${{ github.event.inputs.changelog_count || '20' }}

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wiki home page
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_DATE=$(git log -1 --pretty=format:"%ci")
          REPO_URL="https://github.com/${REPO}"
          UPDATED=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          {
            echo "# ${REPO_NAME} Wiki"
            echo ""
            echo "Welcome to the **${REPO_NAME}** project wiki. This page is automatically updated on every push to \`main\`."
            echo ""
            echo "## Latest Update"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Commit** | [\`${SHORT_SHA}\`](${REPO_URL}/commit/${COMMIT_SHA}) |"
            echo "| **Message** | ${COMMIT_MSG} |"
            echo "| **Author** | ${COMMIT_AUTHOR} |"
            echo "| **Date** | ${COMMIT_DATE} |"
            echo ""
            echo "## Recent Changelog"
            echo ""
            git log --pretty=format:"- [\`%h\`](${REPO_URL}/commit/%H) %s (%an, %ci)" "-${CHANGELOG_COUNT}"
            echo ""
            echo ""
            echo "---"
            echo "*Last updated: ${UPDATED}*"
          } > wiki/Home.md

      - name: Commit and push wiki changes
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Home.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update wiki for commit ${{ github.sha }}"
            git push
          fi

